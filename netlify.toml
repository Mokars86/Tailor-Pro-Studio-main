[build]
  base = "Tailor-Pro-Studio-main"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/parse-dictation"
  to = "/.netlify/functions/parse-dictation"
  status = 200

[[redirects]]
  from = "/api/analyze-fabric"
  to = "/.netlify/functions/analyze-fabric"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
